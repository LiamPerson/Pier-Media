<!DOCTYPE html>
<html lang="en">
	<head>
		<title>Video Details | Pier Media</title>
		<meta charset="UTF-8" />
		<meta
			name="viewport"
			content="width=device-width"
		/>
		<link
			rel="stylesheet"
			href="./custom.css"
		/>
		<link
			rel="icon"
			type="image/png"
			href="./logo512.png"
		/>
	</head>
	<body>
		<header>
			<a
				href="./"
				class="logo"
				><img src="./icon.png" /> Pier</a
			>
			<div class="search-container">
				<form
					action="./"
					method="get"
				>
					<input
						id="search"
						name="q"
						type="search"
						placeholder="Search videos..."
						class="search-input"
					/>
					<submit></submit>
				</form>
			</div>
			<button
				class="theme-toggle"
				onclick="toggleTheme()"
			>
				<svg
					stroke="currentColor"
					fill="currentColor"
					stroke-width="0"
					version="1.1"
					viewBox="0 0 16 16"
					height="1.5rem"
					width="1.5rem"
					xmlns="http://www.w3.org/2000/svg"
				>
					<path
						d="M8 4c-2.209 0-4 1.791-4 4s1.791 4 4 4 4-1.791 4-4-1.791-4-4-4zM8 10.5v-5c1.379 0 2.5 1.122 2.5 2.5s-1.121 2.5-2.5 2.5zM8 13c0.552 0 1 0.448 1 1v1c0 0.552-0.448 1-1 1s-1-0.448-1-1v-1c0-0.552 0.448-1 1-1zM8 3c-0.552 0-1-0.448-1-1v-1c0-0.552 0.448-1 1-1s1 0.448 1 1v1c0 0.552-0.448 1-1 1zM15 7c0.552 0 1 0.448 1 1s-0.448 1-1 1h-1c-0.552 0-1-0.448-1-1s0.448-1 1-1h1zM3 8c0 0.552-0.448 1-1 1h-1c-0.552 0-1-0.448-1-1s0.448-1 1-1h1c0.552 0 1 0.448 1 1zM12.95 11.536l0.707 0.707c0.39 0.39 0.39 1.024 0 1.414s-1.024 0.39-1.414 0l-0.707-0.707c-0.39-0.39-0.39-1.024 0-1.414s1.024-0.39 1.414 0zM3.050 4.464l-0.707-0.707c-0.391-0.391-0.391-1.024 0-1.414s1.024-0.391 1.414 0l0.707 0.707c0.391 0.391 0.391 1.024 0 1.414s-1.024 0.391-1.414 0zM12.95 4.464c-0.39 0.391-1.024 0.391-1.414 0s-0.39-1.024 0-1.414l0.707-0.707c0.39-0.391 1.024-0.391 1.414 0s0.39 1.024 0 1.414l-0.707 0.707zM3.050 11.536c0.39-0.39 1.024-0.39 1.414 0s0.391 1.024 0 1.414l-0.707 0.707c-0.391 0.39-1.024 0.39-1.414 0s-0.391-1.024 0-1.414l0.707-0.707z"
					></path>
				</svg>
			</button>
		</header>
		<main class="video-detail">
			<video
				id="video"
				controls
				autoplay
				class="video-player"
			></video>
			<div class="content">
				<h1 id="title">Video title</h1>
				<h2 id="uploader"><a href="./">Uploader</a></h2>
				<div class="meta">
					<p id="dateAndLength">MM:SS • X days ago</p>
					<div
						id="tags"
						class="tags"
					>
						<span class="tag">Loading tags ...</span>
					</div>
				</div>
				<div class="description">
					<h3>Description</h3>
					<p id="description">...</p>
				</div>
				<p>
					Source:
					<a
						id="source"
						href="#"
						>Link</a
					>
				</p>
			</div>
		</main>
		<section
			id="related-videos"
			class="video-grid"
		></section>
	</body>
	<script src="./environment.js"></script>
	<script src="./utilities.js"></script>
	<script src="./persist-search.js"></script>
	<script src="./persist-volume.js"></script>
	<script src="./get-video.js"></script>
	<script src="./theme-control.js"></script>
</html>
